<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math of the Day — Year 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B3A;
    --ink-soft:#4A4A72;
    --paper:#FFF9EE;
    --card:#ffffff;
    --coral:#FF6B5E;
    --coral-deep:#E44E42;
    --gold:#FFB238;
    --gold-deep:#E0921C;
    --teal:#22B8A6;
    --teal-deep:#178F81;
    --violet:#8C6FF7;
    --violet-deep:#6C4FD6;
    --grass:#4CC26A;
    --grass-deep:#379E52;
    --line:#E7E1D3;
    --shadow: 0 10px 24px rgba(27,27,58,0.10), 0 2px 6px rgba(27,27,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body.no-scroll{ overflow:hidden; height:100vh; }
  body{
    background:
      radial-gradient(1100px 700px at 8% -10%, #FFEFD6 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #E7F7F3 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Nunito', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px 90px;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; }

  /* ---------- header ---------- */
  .topbar{
    width:100%;
    max-width:1080px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--coral),var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;color:#fff;font-size:20px;
    box-shadow:var(--shadow);
    transform:rotate(-6deg);
  }
  .brand-text h1{ font-size:20px; margin:0; line-height:1.1; font-weight:800; }
  .brand-text p{ margin:0; font-size:12.5px; color:var(--ink-soft); font-weight:700; letter-spacing:.02em; }

  .set-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .set-tab{
    border:none; cursor:pointer; padding:8px 14px; border-radius:999px;
    font-family:'Baloo 2'; font-weight:700; font-size:13.5px;
    background:#fff; color:var(--ink-soft); box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .set-tab:hover{ transform:translateY(-2px); }
  .set-tab.active{ color:#fff; }
  .set-tab.active[data-set="1"]{ background:var(--coral); }
  .set-tab.active[data-set="2"]{ background:var(--gold); }
  .set-tab.active[data-set="3"]{ background:var(--violet); }
  .set-tab.active[data-set="4"]{ background:var(--teal); }
  .set-tab.active[data-set="0"]{ background:var(--ink); }

  .notd-btn .caret{ display:inline-block; transition:transform .2s ease; font-size:11px; margin-left:2px; }
  .notd-btn.open .caret{ transform:rotate(180deg); }
  .notd-btn.active{ background:var(--ink); color:#fff; }
  .notd-sub{
    display:none; gap:6px; flex-wrap:wrap; align-items:center;
    padding-left:2px;
  }
  .notd-sub.expanded{ display:inline-flex; }
  .notd-sub .sub-tab{ font-size:12.5px; padding:7px 12px; }

  /* ---------- stage ---------- */
  .stage{ width:100%; max-width:1080px; }

  .intro-card{
    background:var(--card); border-radius:26px; box-shadow:var(--shadow);
    padding:44px clamp(20px,5vw,56px); text-align:center;
  }
  .intro-card .eyebrow{
    font-family:'Baloo 2'; font-weight:700; color:var(--violet-deep);
    text-transform:uppercase; letter-spacing:.14em; font-size:13px; margin-bottom:6px;
  }
  .intro-card h2{ font-size:clamp(28px,5vw,42px); margin:0 0 6px; }
  .intro-card .sub{ color:var(--ink-soft); font-weight:700; margin-bottom:26px; }
  .intro-card ul{ text-align:left; max-width:640px; margin:0 auto; padding-left:0; list-style:none; display:grid; gap:12px; }
  .intro-card li{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:14px 18px; font-weight:600; color:var(--ink); line-height:1.45;
  }

  .day-card{
    background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    padding:clamp(18px,3.4vw,34px); position:relative; overflow:hidden;
  }
  .day-card::before{
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background:
      radial-gradient(500px 220px at -8% -18%, var(--set-tint,#FFEDE9) 0%, transparent 60%);
  }
  .day-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; margin-bottom:18px;}
  .day-head .tag{
    font-family:'Baloo 2'; font-weight:700; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--set-deep,#E44E42); background:var(--set-tint,#FFEDE9); padding:6px 12px; border-radius:999px;
  }
  .day-head .count{ font-weight:800; color:var(--ink-soft); font-size:13px; }

  .hero{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; justify-content:center; position:relative; z-index:1; margin-bottom:22px;}
  .burst{
    width:150px;height:150px;flex:0 0 auto;border-radius:38% 62% 60% 40% / 45% 40% 60% 55%;
    background:linear-gradient(150deg,var(--set-main,#FF6B5E),var(--set-deep,#E44E42));
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 14px 26px -8px var(--set-deep,#E44E42);
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{ transform:scale(.7) rotate(-8deg); opacity:0;} to{ transform:scale(1) rotate(0deg); opacity:1;} }
  .burst-num{ font-family:'Baloo 2'; font-weight:800; color:#fff; font-size:clamp(22px,4.4vw,32px); text-align:center; padding:6px; word-break:break-word; }
  .hero-label{ font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.12em; font-size:13px; }

  .qgrid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;
    position:relative; z-index:1;
  }
  .qcard{
    perspective:900px; min-height:108px; cursor:pointer;
  }
  .qcard-inner{
    position:relative; width:100%; height:100%; min-height:108px;
    transition:transform .5s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d;
    border-radius:18px;
  }
  .qcard.flipped .qcard-inner{ transform:rotateY(180deg); }
  .qface{
    position:absolute; inset:0; border-radius:18px; backface-visibility:hidden;
    padding:14px 16px; display:flex; flex-direction:column; justify-content:center; gap:6px;
    border:2px solid var(--line);
  }
  .qface.front{ background:#fff; }
  .qface.front .lbl{ font-weight:700; color:var(--ink); font-size:14.5px; line-height:1.3; }
  .qface.front .hint{ font-size:12px; font-weight:800; color:var(--set-deep,#E44E42); text-transform:uppercase; letter-spacing:.08em; }
  .qface.back{
    background:linear-gradient(155deg,var(--set-main,#FF6B5E),var(--set-deep,#E44E42));
    color:#fff; transform:rotateY(180deg); align-items:flex-start;
  }
  .qface.back .lbl{ font-weight:700; opacity:.85; font-size:12.5px; }
  .qface.back .ans{ font-family:'Baloo 2'; font-weight:700; font-size:clamp(16px,2.6vw,21px); }

  .widgets{ display:grid; grid-template-columns:1fr; gap:16px; margin-top:18px; position:relative; z-index:1;}
  @media(min-width:760px){ .widgets{ grid-template-columns:1.3fr 1fr; } }

  .widget{
    background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px 18px;
    cursor:pointer;
  }
  .widget h3{ margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }

  .nline{ position:relative; height:54px; margin-top:6px; }
  .nline .rail{ position:absolute; left:0; right:0; top:26px; height:4px; background:var(--line); border-radius:2px; }
  .nline .tick{ position:absolute; top:14px; width:2px; height:28px; background:var(--ink-soft); opacity:.5; }
  .nline .ticklabel{ position:absolute; top:-2px; transform:translateX(-50%); font-weight:800; font-size:12px; color:var(--ink-soft); }
  .nline .marker{
    position:absolute; top:6px; transform:translate(-50%,0); display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:opacity .25s ease;
  }
  .nline .dot{ width:14px;height:14px;border-radius:50%; background:var(--set-deep,#E44E42); border:3px solid #fff; box-shadow:0 0 0 2px var(--set-deep,#E44E42);}
  .nline .marklabel{ font-family:'Baloo 2'; font-weight:700; font-size:13px; background:var(--set-deep,#E44E42); color:#fff; padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .nline.hidden .marker{ opacity:0; pointer-events:none; }
  .nline-hint{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-top:4px; }

  .pvhouse{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .pvbox{
    min-width:52px; border-radius:12px; text-align:center; padding:8px 6px; background:#fff; border:2px solid var(--line);
  }
  .pvbox .d{ font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--ink); visibility:hidden; }
  .pvbox.show .d{ visibility:visible; }
  .pvbox .p{ font-size:9.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }

  .blockrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .blockchip{
    background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; text-align:center; min-width:76px;
  }
  .blockchip .v{ font-family:'Baloo 2'; font-weight:800; font-size:18px; visibility:hidden; }
  .blockchip.show .v{ visibility:visible; }
  .blockchip .p{ font-size:10.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; }

  /* ---------- footer nav ---------- */
  .navbar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .navcluster{
    pointer-events:auto;
    background:var(--ink); color:#fff; border-radius:999px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; padding:8px 10px 8px 18px;
    max-width:96vw;
  }
  .navcluster button{
    border:none; cursor:pointer; background:#fff; color:var(--ink); font-family:'Baloo 2'; font-weight:700;
    border-radius:999px; padding:10px 18px; font-size:14px; transition:transform .12s ease;
  }
  .navcluster button:hover{ transform:translateY(-1px); }
  .navcluster button:disabled{ opacity:.35; cursor:default; transform:none; }
  .navcluster .pos{ font-weight:800; font-size:13px; min-width:64px; text-align:center; }
  .navcluster .reveal-btn{ background:var(--gold); color:var(--ink); }

  @media(max-width:520px){
    .navcluster{ gap:8px; padding:8px; }
    .navcluster button{ padding:9px 12px; font-size:13px; }
    .navcluster .pos{ min-width:48px; font-size:12px; }
  }

  /* ---------- x Algorithms ---------- */
  .set-tab.active[data-set="X"]{ background:#E63946; }

  .algo-hero{
    background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    padding:clamp(20px,4vw,40px); text-align:center; margin-bottom:16px;
  }
  .algo-hero .eyebrow{
    font-family:'Baloo 2'; font-weight:700; color:#E63946;
    text-transform:uppercase; letter-spacing:.14em; font-size:13px; margin-bottom:6px;
  }
  .algo-hero h2{ font-size:clamp(26px,4.6vw,38px); margin:0 0 8px; }
  .algo-hero p{ color:var(--ink-soft); font-weight:700; max-width:620px; margin:0 auto; }
  .multplay-frame{
    width:100%; height:min(1080px, calc(100vh - 220px)); min-height:640px;
    border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow);
    background:#fff; display:block;
  }

  .partsgrid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px;
  }
  .partbtn{
    border:none; cursor:pointer; border-radius:16px; padding:16px 8px;
    background:#fff; box-shadow:var(--shadow); font-family:'Baloo 2'; font-weight:800;
    color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .15s ease;
  }
  .partbtn:hover{ transform:translateY(-3px) scale(1.03); }
  .partbtn .n{ font-size:20px; }
  .partbtn .lab{ font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .partbtn.done{ background:linear-gradient(150deg,#FFE3A8,#FFC857); }

  .backbtn{
    border:none; cursor:pointer; background:var(--ink); color:#fff; font-family:'Baloo 2';
    font-weight:700; border-radius:999px; padding:9px 16px; font-size:13.5px; margin-bottom:14px;
  }

  .drill-fullscreen{
    position:fixed; inset:0; z-index:60; background:var(--paper);
    display:flex; flex-direction:column;
    padding: 10px clamp(10px,2vw,26px) 14px;
  }
  .drill-topline{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:0 0 auto;
  }
  .drill-title{ font-family:'Baloo 2'; font-weight:800; font-size:clamp(16px,2.2vw,22px); white-space:nowrap; }
  .drill-sub{ color:var(--ink-soft); font-weight:700; font-size:12px; white-space:nowrap; }

  .timerbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex:1;
    background:linear-gradient(150deg,#FFF3DC,#FFE8B8); border-radius:18px;
    padding:8px 16px; position:relative; overflow:hidden; min-height:56px;
  }
  .chicken-zone{ position:relative; width:52px; height:52px; flex:0 0 auto; }
  .chicken{ font-size:36px; line-height:52px; text-align:center; transform-origin:50% 80%; }
  .chicken.flap{ animation:flap .35s ease 3; }
  @keyframes flap{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-12deg) translateY(-3px);} }
  .egg-lane{ position:absolute; left:46px; top:30px; height:24px; width:calc(100vw); max-width:1100px; overflow:visible; pointer-events:none; }
  .egg{
    position:absolute; left:0; top:0; font-size:20px;
    animation: rollEgg 3.2s linear forwards;
  }
  @keyframes rollEgg{
    0%{ transform:translateX(0) rotate(0deg); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateX(min(80vw,760px)) rotate(720deg); opacity:0; }
  }
  .timer-display{
    font-family:'Baloo 2'; font-weight:800; font-size:clamp(24px,3.6vw,34px); color:#B8322A;
    min-width:96px; letter-spacing:.02em;
  }
  .timer-display.urgent{ color:#E63946; animation:pulse .6s ease infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  .timer-controls{ display:flex; gap:8px; margin-left:auto; }
  .timer-controls button{
    border:none; cursor:pointer; border-radius:999px; padding:8px 14px; font-family:'Baloo 2';
    font-weight:700; font-size:13px; background:#fff; box-shadow:var(--shadow); color:var(--ink);
  }
  .timer-controls .primary{ background:#E63946; color:#fff; }
  .timesup-banner{
    display:none; background:#E63946; color:#fff; font-family:'Baloo 2'; font-weight:800;
    text-align:center; padding:6px; border-radius:12px; margin:6px 0 0; letter-spacing:.03em;
    font-size:13px; flex:0 0 auto;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .timesup-banner.show{ display:block; }

  .algogrid{
    display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(4,1fr);
    gap:clamp(4px,0.6vw,10px); flex:1; min-height:0; margin-top:8px;
  }
  @media(max-width:900px){ .algogrid{ grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(8,1fr); } }

  .algobox{
    background:#fff; border:2px solid var(--line); border-radius:10px;
    font-family:'DM Mono','Courier New',monospace;
    display:flex; flex-direction:column; justify-content:center; align-items:stretch;
    padding:2px 8px; min-height:0; overflow:hidden;
  }
  .algo-row{ text-align:right; padding-right:2px; font-weight:700; color:var(--ink); line-height:1.15;
    font-size:clamp(14px, 2.1vw, 26px); }
  .algo-row.op{ border-bottom:2.5px solid var(--ink); padding-bottom:2px; }

  /* ---- answer key modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(27,27,58,0.55); z-index:100;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff; border-radius:22px; padding:22px clamp(16px,3vw,30px); max-width:1100px; width:100%;
    max-height:88vh; overflow:auto; box-shadow:var(--shadow);
  }
  .modal-box h3{ margin:0 0 4px; font-size:20px; }
  .modal-box .sub{ color:var(--ink-soft); font-weight:700; font-size:13px; margin-bottom:14px; }
  .keygrid{ display:grid; grid-template-columns:repeat(10,1fr); gap:8px; }
  @media(max-width:820px){ .keygrid{ grid-template-columns:repeat(5,1fr); } }
  .keycell{
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px 4px;
    text-align:center; font-family:'DM Mono','Courier New',monospace; font-weight:700; font-size:14px;
  }
  .keycell .q{ color:var(--ink-soft); font-size:11px; }
  .keycell .a{ color:#178F81; font-size:16px; }
  .modal-close{
    margin-top:16px; border:none; cursor:pointer; background:var(--ink); color:#fff; font-family:'Baloo 2';
    font-weight:700; border-radius:999px; padding:10px 20px; font-size:14px;
  }

  /* ---------- Word Problem Workshop ---------- */
  .set-tab.active[data-set="W"]{ background:#2E86DE; }
  .partbtn.wp-btn.done{ background:linear-gradient(150deg,#BEE3FF,#8FCBFF); }
  .partbtn .stagepill{
    font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    background:#E5F1FC; color:#1D5FA8; padding:2px 7px; border-radius:999px; margin-top:2px;
  }

  .wp-card{
    background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    padding:clamp(16px,3vw,30px);
  }
  .wp-top{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .wp-title{ font-family:'Baloo 2'; font-weight:800; font-size:clamp(17px,2.6vw,21px); }
  .wp-stagepill{
    font-family:'Baloo 2'; font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    background:#E5F1FC; color:#1D5FA8; padding:6px 14px; border-radius:999px;
  }
  .wp-problem{
    font-family:'Baloo 2'; font-size:clamp(17px,2.3vw,22px); font-weight:700; color:var(--ink);
    background:linear-gradient(150deg,#EAF4FF,#F5FAFF); border:2px solid #D6E9FB; border-radius:18px;
    padding:18px 22px; margin-bottom:20px; line-height:1.4;
  }

  .wp-step{
    background:#fff; border:2px solid var(--line); border-radius:20px;
    padding:16px 20px 18px; margin-bottom:16px; animation:pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  .wp-step-head{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .wp-step-num{
    width:32px; height:32px; border-radius:50%; background:#2E86DE; color:#fff;
    font-family:'Baloo 2'; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .wp-step-title{ font-family:'Baloo 2'; font-weight:800; font-size:16px; }
  .wp-step-prompt{ color:var(--ink-soft); font-weight:700; font-size:14.5px; margin:0 0 10px 44px; }
  .wp-hint-btn{
    margin-left:44px; border:none; cursor:pointer; background:#FFF3DC; color:#B8322A;
    font-family:'Baloo 2'; font-weight:700; font-size:13px; padding:8px 14px; border-radius:999px;
  }
  .wp-hint-content{
    display:none; margin:12px 0 0 44px; background:var(--paper); border-radius:14px; padding:12px 16px;
  }
  .wp-hint-content.show{ display:block; }
  .wp-hint-content ul{ margin:0; padding-left:18px; }
  .wp-hint-content li{ margin-bottom:5px; font-weight:600; }
  .wp-eq{ font-family:'DM Mono','Courier New',monospace; font-weight:700; font-size:17px; color:#1D5FA8; margin-bottom:4px; }
  .wp-eq .final{ color:#178F81; }

  .wp-next-wrap{ text-align:center; margin:6px 0 18px; }
  .wp-next-btn{
    border:none; cursor:pointer; background:#2E86DE; color:#fff; font-family:'Baloo 2'; font-weight:700;
    font-size:14.5px; padding:12px 26px; border-radius:999px; box-shadow:var(--shadow);
  }

  .wp-practice{
    border:2px dashed #8FCBFF; border-radius:20px; padding:18px 22px; margin-top:8px;
    background:#F5FAFF;
  }

const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine",
  "ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const SCALES = ["","thousand","million","billion"];

function chunkWords(num){
  let s = "";
  if(num >= 100){
    s += ONES[Math.floor(num/100)] + " hundred";
    num = num % 100;
    if(num > 0) s += " and ";
  }
  if(num >= 20){
    s += TENS[Math.floor(num/10)];
    if(num % 10 > 0) s += "-" + ONES[num % 10];
  } else if(num > 0){
    s += ONES[num];
  }
  return s;
}

function intToWords(n){
  if(n === 0) return "zero";
  const groups = [];
  while(n > 0){ groups.push(n % 1000); n = Math.floor(n / 1000); }
  const parts = [];
  for(let i = groups.length - 1; i >= 0; i--){
    if(groups[i] === 0) continue;
    let words = chunkWords(groups[i]);
    if(SCALES[i]) words += " " + SCALES[i];
    parts.push(words);
  }
  return parts.join(", ");
}

function numberToWordsFull(raw){
  const clean = raw.replace(/,/g, "");
  const [intPart, decPart] = clean.split(".");
  let words = intToWords(parseInt(intPart, 10) || 0);
  if(decPart){
    words += " point " + decPart.split("").map(d => ONES[parseInt(d,10)]).join(" ");
  }
  return words;
}

function fmt(x){
  x = Math.round(x * 100000) / 100000; // kill float noise
  let s;
  if(Object.is(x, -0)) x = 0;
  if(Number.isInteger(x)){
    s = x.toString();
  } else {
    s = x.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
  }
  let neg = s.startsWith('-');
  if(neg) s = s.slice(1);
  let [ip, dp] = s.split('.');
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + ip + (dp ? '.' + dp : '');
}

function roundTo(n, unit){
  return Math.round((n / unit) + (n >= 0 ? 1e-9 : -1e-9)) * unit;
}

function expandedForm(raw){
  const clean = raw.replace(/,/g, "");
  const [intPart, decPart] = clean.split(".");
  const terms = [];
  const L = intPart.length;
  for(let i = 0; i < L; i++){
    const d = parseInt(intPart[i], 10);
    if(d === 0) continue;
    const placeVal = d * Math.pow(10, L - 1 - i);
    terms.push(fmt(placeVal));
  }
  if(decPart){
    for(let i = 0; i < decPart.length; i++){
      const d = parseInt(decPart[i], 10);
      if(d === 0) continue;
      const placeVal = d / Math.pow(10, i + 1);
      terms.push(placeVal.toFixed(i + 1));
    }
  }
  return terms.length ? terms.join(" + ") : "0";
}

const INT_PLACES = ["ones","tens","hundreds","thousands","ten-thousands","hundred-thousands","millions","ten-millions"];
const DEC_PLACES = ["tenths","hundredths","thousandths"];

function digitBreakdown(raw){
  const clean = raw.replace(/,/g, "");
  const [intPart, decPart] = clean.split(".");
  const L = intPart.length;
  const out = [];
  for(let i = 0; i < L; i++){
    out.push({ digit: intPart[i], place: INT_PLACES[L - 1 - i] || ("10^" + (L-1-i)) });
  }
  if(decPart){
    for(let i = 0; i < decPart.length; i++){
      out.push({ digit: decPart[i], place: DEC_PLACES[i] || ("dp" + (i+1)) });
    }
  }
  return out;
}

function blockBreakdown(raw){
  const n = parseInt(raw.replace(/,/g, ""), 10);
  const thousands = Math.floor(n / 1000);
  const rem = n % 1000;
  const hundreds = Math.floor(rem / 100);
  const tens = Math.floor((rem % 100) / 10);
  const ones = rem % 10;
  const out = [];
  if(thousands > 0) out.push({ label: thousands === 1 ? "thousand" : "thousands", val: fmt(thousands) });
  out.push({ label: "hundreds", val: hundreds });
  out.push({ label: "tens", val: tens });
  out.push({ label: "ones", val: ones });
  return out;
}

function autoTicks(n){
  const abs = Math.abs(n);
  if(abs === 0) return [0, 5, 10];
  const mag = Math.pow(10, Math.floor(Math.log10(abs)));
  const step = (abs / mag < 2) ? mag / 2 : mag;
  let high = Math.ceil((abs + 1e-9) / step) * step;
  if(high - abs < step * 0.08) high += step;
  let low = high - 2 * step;
  if(low < 0) low = 0;
  const mid = (low + high) / 2;
  return [low, mid, high].map(x => Math.round(x * 1e6) / 1e6);
}

function computeAnswer(rawNum, q){
  const n = parseFloat(rawNum.replace(/,/g, ""));
  switch(q.t){
    case 'expanded': return expandedForm(rawNum);
    case 'delta': return fmt(n + q.a);
    case 'round': return fmt(roundTo(n, q.u));
    case 'parity': return (Math.round(n) % 2 === 0) ? "Even" : "Odd";
    case 'words': return numberToWordsFull(rawNum);
    case 'digit': return q.val;
    case 'mul': return fmt(n * q.f);
    case 'div': return fmt(n / q.f);
    case 'percent': return fmt(n * q.p / 100);
    case 'findWhole': return fmt(n / (q.p / 100));
    case 'half': return fmt(n / 2);
    case 'fraction': return fmt(n * q.num / q.den);
    case 'lit': return q.a;
    case 'countBack': return fmt(n - q.a);
    case 'listNext': {
      const out = [];
      for(let i = 1; i <= 3; i++) out.push(fmt(n + q.step * i));
      return out.join(', ');
    }
    case 'coins': return fmt(Math.round((n / 0.1) * 1e6) / 1e6);
    default: return "?";
  }
}

function displayNumber(raw){
  const clean = raw.replace(/,/g, "");
  const n = parseFloat(clean);
  return fmt(n);
}

<script>
  // ---- build the full deck: intros interleaved with their set's number slides ----
  const DECK = [];
  for(let s = 1; s <= 4; s++){
    DECK.push({ kind:'intro', ...INTROS[s-1], set:s });
    SLIDES.filter(sl => sl.set === s).forEach(sl => DECK.push({ kind:'number', ...sl }));
  }

  const SET_THEME = {
    1:{main:'#FF6B5E',deep:'#E44E42',tint:'#FFEDE9',name:'Set 1'},
    2:{main:'#FFB238',deep:'#E0921C',tint:'#FFF3DC',name:'Set 2'},
    3:{main:'#8C6FF7',deep:'#6C4FD6',tint:'#F0EBFF',name:'Set 3'},
    4:{main:'#22B8A6',deep:'#178F81',tint:'#E4F7F4',name:'Set 4'}
  };

  let idx = 0;
  let mode = 'deck'; // 'deck' | 'algoGrid' | 'algoDrill' | 'wpGrid' | 'wpDrill'
  let currentAlgoPart = null;
  let currentWPPart = null;
  let wpPhase = 'iDo'; // 'iDo' | 'weDo' | 'youDo'
  let wpStepIndex = 0;
  const completedParts = new Set();
  const completedWPParts = new Set();

  let notdExpanded = false;

  function buildTabs(){
    const wrap = document.getElementById('setTabs');
    wrap.innerHTML = '';

    const notdBtn = document.createElement('button');
    notdBtn.className = 'set-tab notd-btn';
    notdBtn.dataset.set = 'NOTD';
    notdBtn.innerHTML = `#️⃣ NOTD <span class="caret">▾</span>`;
    notdBtn.addEventListener('click', () => {
      notdExpanded = !notdExpanded;
      subRow.classList.toggle('expanded', notdExpanded);
      notdBtn.classList.toggle('open', notdExpanded);
    });
    wrap.appendChild(notdBtn);

    const subRow = document.createElement('span');
    subRow.className = 'notd-sub' + (notdExpanded ? ' expanded' : '');
    for(let s = 1; s <= 4; s++){
      const b = document.createElement('button');
      b.className = 'set-tab sub-tab';
      b.dataset.set = s;
      b.textContent = SET_THEME[s].name;
      b.addEventListener('click', () => {
        mode = 'deck';
        idx = DECK.findIndex(d => d.set === s);
        notdExpanded = false;
        render();
      });
      subRow.appendChild(b);
    }
    wrap.appendChild(subRow);

    const xb = document.createElement('button');
    xb.className = 'set-tab';
    xb.dataset.set = 'X';
    xb.textContent = '🐔 x Algorithms';
    xb.addEventListener('click', () => { mode = 'algoGrid'; notdExpanded = false; render(); });
    wrap.appendChild(xb);

    const wb = document.createElement('button');
    wb.className = 'set-tab';
    wb.dataset.set = 'W';
    wb.textContent = '🧩 Word Problems';
    wb.addEventListener('click', () => { mode = 'wpGrid'; notdExpanded = false; render(); });
    wrap.appendChild(wb);

    const mb = document.createElement('button');
    mb.className = 'set-tab';
    mb.dataset.set = 'M';
    mb.textContent = '✖️ Multiplication Playground';
    mb.addEventListener('click', () => { mode = 'multPlay'; notdExpanded = false; render(); });
    wrap.appendChild(mb);
  }

  function highlightTab(setNum){
    const notdBtn = document.querySelector('.notd-btn');
    const subRow = document.querySelector('.notd-sub');
    if(notdBtn) notdBtn.classList.toggle('active', mode === 'deck');
    if(subRow) subRow.classList.toggle('expanded', notdExpanded);
    document.querySelectorAll('.sub-tab').forEach(b => {
      b.classList.toggle('active', mode === 'deck' && parseInt(b.dataset.set,10) === setNum);
    });
    document.querySelectorAll('.set-tab:not(.notd-btn):not(.sub-tab)').forEach(b => {
      let match;
      if(mode === 'algoGrid' || mode === 'algoDrill') match = (b.dataset.set === 'X');
      else if(mode === 'wpGrid' || mode === 'wpDrill') match = (b.dataset.set === 'W');
      else if(mode === 'multPlay') match = (b.dataset.set === 'M');
      else match = false;
      b.classList.toggle('active', match);
    });
  }

  function makeQCard(rawNum, q){
    const card = document.createElement('div');
    card.className = 'qcard';
    const inner = document.createElement('div');
    inner.className = 'qcard-inner';

    const front = document.createElement('div');
    front.className = 'qface front';
    front.innerHTML = `<div class="lbl">${q.l}</div><div class="hint">Tap to reveal</div>`;

    const back = document.createElement('div');
    back.className = 'qface back';
    const answer = computeAnswer(rawNum, q);
    back.innerHTML = `<div class="lbl">${q.l}</div><div class="ans">${answer}</div>`;

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    card.addEventListener('click', () => card.classList.toggle('flipped'));
    return card;
  }

  function renderNumberLine(container, n, deep){
    const wrap = document.createElement('div');
    wrap.className = 'nline hidden';
    const rail = document.createElement('div'); rail.className = 'rail';
    wrap.appendChild(rail);

    const [lo, mid, hi] = autoTicks(n);
    [[lo,0],[mid,50],[hi,100]].forEach(([val,pct]) => {
      const t = document.createElement('div'); t.className = 'tick'; t.style.left = pct + '%';
      wrap.appendChild(t);
      const lab = document.createElement('div'); lab.className = 'ticklabel'; lab.style.left = pct + '%'; lab.textContent = fmt(val);
      wrap.appendChild(lab);
    });

    const range = hi - lo || 1;
    const pos = Math.min(100, Math.max(0, ((n - lo) / range) * 100));
    const marker = document.createElement('div'); marker.className = 'marker'; marker.style.left = pos + '%';
    marker.innerHTML = `<div class="marklabel">${displayNumber(String(n))}</div><div class="dot"></div>`;
    wrap.appendChild(marker);

    const widget = document.createElement('div');
    widget.className = 'widget';
    widget.innerHTML = `<h3>Find it on the number line</h3>`;
    const hint = document.createElement('div'); hint.className = 'nline-hint'; hint.textContent = 'Tap to show where the number sits';
    widget.appendChild(wrap);
    widget.appendChild(hint);
    widget.addEventListener('click', () => {
      wrap.classList.toggle('hidden');
      hint.textContent = wrap.classList.contains('hidden') ? 'Tap to show where the number sits' : 'Tap to hide';
    });
    container.appendChild(widget);
  }

  function renderPVHouse(container, raw){
    const widget = document.createElement('div');
    widget.className = 'widget';
    widget.innerHTML = `<h3>Place value house</h3>`;
    const row = document.createElement('div'); row.className = 'pvhouse';
    digitBreakdown(raw).forEach(({digit, place}) => {
      const box = document.createElement('div'); box.className = 'pvbox';
      box.innerHTML = `<div class="d">${digit}</div><div class="p">${place}</div>`;
      row.appendChild(box);
    });
    widget.appendChild(row);
    widget.addEventListener('click', () => {
      row.querySelectorAll('.pvbox').forEach(b => b.classList.toggle('show'));
    });
    container.appendChild(widget);
  }

  function renderBlocks(container, raw){
    const widget = document.createElement('div');
    widget.className = 'widget';
    widget.innerHTML = `<h3>How many place-value blocks?</h3>`;
    const row = document.createElement('div'); row.className = 'blockrow';
    blockBreakdown(raw).forEach(({label, val}) => {
      const chip = document.createElement('div'); chip.className = 'blockchip';
      chip.innerHTML = `<div class="v">${val}</div><div class="p">${label}</div>`;
      row.appendChild(chip);
    });
    widget.appendChild(row);
    widget.addEventListener('click', () => {
      row.querySelectorAll('.blockchip').forEach(c => c.classList.toggle('show'));
    });
    container.appendChild(widget);
  }

  function render(){
    stopTimer();
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    if(mode === 'algoGrid'){
      highlightTab(null);
      document.querySelector('.navbar').style.display = 'none';
      document.querySelector('.topbar').style.display = '';
      document.body.classList.remove('no-scroll');
      renderAlgoGrid(stage);
      return;
    }
    if(mode === 'algoDrill'){
      highlightTab(null);
      document.querySelector('.navbar').style.display = 'none';
      document.querySelector('.topbar').style.display = 'none';
      document.body.classList.add('no-scroll');
      renderAlgoDrill(stage, currentAlgoPart);
      return;
    }
    if(mode === 'wpGrid'){
      highlightTab(null);
      document.querySelector('.navbar').style.display = 'none';
      document.querySelector('.topbar').style.display = '';
      document.body.classList.remove('no-scroll');
      renderWPGrid(stage);
      return;
    }
    if(mode === 'wpDrill'){
      highlightTab(null);
      document.querySelector('.navbar').style.display = 'none';
      document.querySelector('.topbar').style.display = '';
      document.body.classList.remove('no-scroll');
      renderWPDrill(stage, currentWPPart);
      return;
    }
    if(mode === 'multPlay'){
      highlightTab(null);
      document.querySelector('.navbar').style.display = 'none';
      document.querySelector('.topbar').style.display = '';
      document.body.classList.remove('no-scroll');
      renderMultPlay(stage);
      return;
    }

    document.querySelector('.navbar').style.display = '';
    document.querySelector('.topbar').style.display = '';
    document.body.classList.remove('no-scroll');
    const slide = DECK[idx];
    highlightTab(slide.set);

    if(slide.kind === 'intro'){
      const card = document.createElement('div');
      card.className = 'intro-card';
      card.innerHTML = `
        <div class="eyebrow">${SET_THEME[slide.set].name}</div>
        <h2>${slide.title}</h2>
        <div class="sub">${slide.subtitle}</div>
        <ul>${slide.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      `;
      stage.appendChild(card);
    } else {
      const theme = SET_THEME[slide.set];
      const card = document.createElement('div');
      card.className = 'day-card';
      card.style.setProperty('--set-main', theme.main);
      card.style.setProperty('--set-deep', theme.deep);
      card.style.setProperty('--set-tint', theme.tint);

      const head = document.createElement('div');
      head.className = 'day-head';
      const numbered = SLIDES.filter(s => s.set === slide.set);
      const posInSet = numbered.indexOf(slide) + 1;
      head.innerHTML = `<div class="tag">${theme.name}</div><div class="count">Number ${posInSet} of ${numbered.length}</div>`;
      card.appendChild(head);

      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML = `
        <div class="burst"><div class="burst-num">${displayNumber(slide.n)}</div></div>
        <div class="hero-label">Today's number</div>
      `;
      card.appendChild(hero);

      const grid = document.createElement('div');
      grid.className = 'qgrid';
      slide.q.forEach(q => grid.appendChild(makeQCard(slide.n, q)));
      card.appendChild(grid);

      const widgets = document.createElement('div');
      widgets.className = 'widgets';
      renderNumberLine(widgets, parseFloat(slide.n.replace(/,/g,'')), theme.deep);
      if(slide.blocks){ renderBlocks(widgets, slide.n); } else { renderPVHouse(widgets, slide.n); }
      card.appendChild(widgets);

      stage.appendChild(card);
    }

    document.getElementById('pos').textContent = `${idx+1} / ${DECK.length}`;
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').disabled = idx === DECK.length - 1;
    window.scrollTo({top:0, behavior:'instant'});
  }

  document.getElementById('prevBtn').addEventListener('click', () => { if(idx>0){ idx--; render(); } });
  document.getElementById('nextBtn').addEventListener('click', () => { if(idx<DECK.length-1){ idx++; render(); } });
  document.getElementById('revealBtn').addEventListener('click', () => {
    document.querySelectorAll('.qcard').forEach(c => c.classList.add('flipped'));
    document.querySelectorAll('.nline').forEach(n => n.classList.remove('hidden'));
    document.querySelectorAll('.pvbox, .blockchip').forEach(el => el.classList.add('show'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  });

  // ================= x Algorithms =================

  const roosterAudio = new Audio('data:audio/wav;base64,' + ROOSTER_B64);

  function renderAlgoGrid(stage){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="algo-hero">
        <div class="eyebrow">x Algorithms</div>
        <h2>40 Parts · Long Multiplication Drills</h2>
        <p>Each part is 40 algorithm equations — 8 rows of 5. Beat the 6-minute timer, then the rooster tells you when time's up!</p>
      </div>
    `;
    const grid = document.createElement('div');
    grid.className = 'partsgrid';
    for(let p = 1; p <= 40; p++){
      const b = document.createElement('button');
      b.className = 'partbtn' + (completedParts.has(p) ? ' done' : '');
      b.innerHTML = `<div class="n">${p}</div><div class="lab">Part</div>`;
      b.addEventListener('click', () => {
        currentAlgoPart = p;
        mode = 'algoDrill';
        render();
      });
      grid.appendChild(b);
    }
    wrap.appendChild(grid);
    stage.appendChild(wrap);
  }

  function algoBoxData(a, b){
    if(b < 10){
      return { twoLine:false, product: a*b };
    }
    const ones = b % 10, tens = Math.floor(b/10);
    const p1 = a*ones, p2 = a*tens*10;
    return { twoLine:true, p1, p2, product: p1+p2 };
  }

  let timerState = null; // { remaining, handle, running }

  function stopTimer(){
    if(timerState && timerState.handle){ clearInterval(timerState.handle); }
    timerState = null;
  }

  function spawnEgg(lane){
    const egg = document.createElement('div');
    egg.className = 'egg';
    egg.textContent = '🥚';
    lane.appendChild(egg);
    setTimeout(() => egg.remove(), 3300);
  }

  function renderAlgoDrill(stage, part){
    const pairs = ALGO_PARTS[part-1];

    const wrap = document.createElement('div');
    wrap.className = 'drill-fullscreen';
    wrap.innerHTML = `
      <div class="drill-topline">
        <button class="backbtn" id="backBtn" style="margin:0;">◀ All parts</button>
        <div>
          <div class="drill-title">Part ${part} of 40</div>
          <div class="drill-sub">40 long-multiplication equations · 6 minute drill</div>
        </div>
        <div class="timerbar">
          <div class="chicken-zone">
            <div class="chicken" id="chicken">🐔</div>
            <div class="egg-lane" id="eggLane"></div>
          </div>
          <div class="timer-display" id="timerDisplay">06:00</div>
          <div class="timer-controls">
            <button id="startBtn" class="primary">Start</button>
            <button id="resetBtn">Reset</button>
            <button id="revealAlgoBtn">Answer key</button>
          </div>
        </div>
      </div>
      <div class="timesup-banner" id="timesup">🐔🎉 TIME'S UP! Cock-a-doodle-doo! 🎉🐔</div>
      <div class="algogrid" id="algogrid"></div>
    `;
    stage.appendChild(wrap);

    wrap.querySelector('#backBtn').addEventListener('click', () => { mode = 'algoGrid'; render(); });

    const grid = wrap.querySelector('#algogrid');
    const boxData = pairs.map(([a,b]) => ({ a, b, ...algoBoxData(a,b) }));
    boxData.forEach(({a,b}) => {
      const box = document.createElement('div');
      box.className = 'algobox';
      box.innerHTML = `
        <div class="algo-row">${a}</div>
        <div class="algo-row op">× ${b}</div>
      `;
      grid.appendChild(box);
    });

    // ---- answer key modal ----
    let overlay = document.getElementById('algoAnswerOverlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'algoAnswerOverlay';
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }
    function showAnswerKey(){
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>Part ${part} — Answer Key</h3>
          <div class="sub">Use this to mark your book once you've finished.</div>
          <div class="keygrid">
            ${boxData.map(d => `<div class="keycell"><div class="q">${d.a}×${d.b}</div><div class="a">${d.product}</div></div>`).join('')}
          </div>
          <button class="modal-close" id="closeAnswerKey">Close</button>
        </div>
      `;
      overlay.classList.add('show');
      overlay.querySelector('#closeAnswerKey').addEventListener('click', () => overlay.classList.remove('show'));
      overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });
    }

    const timerDisplay = wrap.querySelector('#timerDisplay');
    const chicken = wrap.querySelector('#chicken');
    const eggLane = wrap.querySelector('#eggLane');
    const timesup = wrap.querySelector('#timesup');
    const startBtn = wrap.querySelector('#startBtn');
    const resetBtn = wrap.querySelector('#resetBtn');
    const revealBtn = wrap.querySelector('#revealAlgoBtn');

    const TOTAL = 6*60;
    function paint(remaining){
      const m = Math.floor(remaining/60), s = remaining%60;
      timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      timerDisplay.classList.toggle('urgent', remaining <= 30 && remaining > 0);
    }
    paint(TOTAL);

    function startTimer(){
      if(timerState && timerState.running) return;
      stopTimer();
      let remaining = timerState && timerState.remaining != null ? timerState.remaining : TOTAL;
      timesup.classList.remove('show');
      timerState = { remaining, running:true };
      timerState.handle = setInterval(() => {
        timerState.remaining -= 1;
        const elapsed = TOTAL - timerState.remaining;
        paint(timerState.remaining);
        if(elapsed > 0 && elapsed % 60 === 0 && timerState.remaining > 0){
          spawnEgg(eggLane);
        }
        if(timerState.remaining <= 0){
          clearInterval(timerState.handle);
          timerState = null;
          paint(0);
          timesup.classList.add('show');
          chicken.classList.add('flap');
          setTimeout(() => chicken.classList.remove('flap'), 1200);
          completedParts.add(part);
          roosterAudio.currentTime = 0;
          roosterAudio.play().catch(()=>{});
          showAnswerKey();
        }
      }, 1000);
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', () => {
      stopTimer();
      timesup.classList.remove('show');
      eggLane.innerHTML = '';
      paint(TOTAL);
    });
    revealBtn.addEventListener('click', showAnswerKey);
  }

  // ================= Multiplication Playground =================

  function renderMultPlay(stage){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="algo-hero">
        <div class="eyebrow" style="color:#6C4FD6;">Multiplication Playground</div>
        <h2>Explore the 1&ndash;12 Chart</h2>
        <p>Simplify fractions, spot the squares, split factors, and chase doubling chains &mdash; all on one interactive times table.</p>
      </div>
    `;
    const frame = document.createElement('iframe');
    frame.className = 'multplay-frame';
    frame.src = 'multiplication-playground.html';
    frame.title = 'Multiplication Playground';
    wrap.appendChild(frame);
    stage.appendChild(wrap);
  }

  // ================= Word Problem Workshop =================

  function renderWPGrid(stage){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="algo-hero">
        <div class="eyebrow" style="color:#1D5FA8;">Word Problem Workshop</div>
        <h2>50 Parts · Solve It Step by Step</h2>
        <p>Parts 1–20 are one-step problems. Parts 21–50 are two-step problems, getting trickier as you go. Draw it, investigate it, equation it, solve it — then try one on your own.</p>
      </div>
    `;
    const grid = document.createElement('div');
    grid.className = 'partsgrid';
    for(let p = 1; p <= 50; p++){
      const stage_ = WP_PARTS[p-1].stage;
      const b = document.createElement('button');
      b.className = 'partbtn wp-btn' + (completedWPParts.has(p) ? ' done' : '');
      b.innerHTML = `<div class="n">${p}</div><div class="lab">Part</div><div class="stagepill">${stage_===1?'1-step':'2-step'}</div>`;
      b.addEventListener('click', () => {
        currentWPPart = p;
        wpPhase = 'iDo';
        wpStepIndex = 0;
        mode = 'wpDrill';
        render();
      });
      grid.appendChild(b);
    }
    wrap.appendChild(grid);
    stage.appendChild(wrap);
  }

  function eqLine(eqObj, reveal){
    if(!reveal) return `${eqObj.e} = ?`;
    if(eqObj.rem) return `${eqObj.e} = <span class="final">${eqObj.q} remainder ${eqObj.r}</span>`;
    if(eqObj.ceil) return `${eqObj.e} → round up → <span class="final">${fmt(eqObj.ans)}</span>`;
    return `${eqObj.e} = <span class="final">${fmt(eqObj.ans)}</span>`;
  }

  const WP_STEPS = [
    { title: '🎨 Draw it out', prompt: 'Sketch a quick picture or diagram of the problem — it doesn\'t need to be neat, just enough to show what\'s happening.' },
    { title: '🔍 Investigate: What do we know?', prompt: 'Find the important numbers and words in the problem. What clues tell you which operation(s) to use?' },
    { title: '✏️ What equation(s) do we need?', prompt: 'Turn the words into a number sentence (or two, in order).' },
    { title: '✅ Solve it', prompt: 'Now solve your equation(s) in the right order to find the answer.' }
  ];

  const PHASE_META = {
    iDo:   { key:'idodo',  label:'🧑‍🏫 I Do',  sub:'Teacher demonstrates', dataKey:'iDo' },
    weDo:  { key:'wedodo', label:'🤝 We Do',  sub:'Let\'s solve it together', dataKey:'weDo' },
    youDo: { key:'youdodo',label:'🧠 You Do', sub:'Your turn — solve it yourself', dataKey:'youDo' }
  };

  function renderWPDrill(stage, part){
    const data = WP_PARTS[part-1];
    const wrap = document.createElement('div');

    const back = document.createElement('button');
    back.className = 'backbtn';
    back.textContent = '◀ All parts';
    back.addEventListener('click', () => { mode = 'wpGrid'; render(); });
    wrap.appendChild(back);

    const crumbBar = document.createElement('div');
    crumbBar.className = 'wp-breadcrumb';
    ['iDo','weDo','youDo'].forEach(ph => {
      const meta = PHASE_META[ph];
      const c = document.createElement('div');
      const order = { iDo:0, weDo:1, youDo:2 };
      c.className = 'wp-crumb' + (ph === wpPhase ? ' active ' + meta.key : (order[ph] < order[wpPhase] ? ' done' : ''));
      c.textContent = meta.label;
      crumbBar.appendChild(c);
    });
    wrap.appendChild(crumbBar);

    const card = document.createElement('div');
    card.className = 'wp-card';
    card.innerHTML = `
      <div class="wp-top">
        <div class="wp-title">Part ${part} of 50</div>
        <div class="wp-stagepill">${data.stage === 1 ? 'One-step problem' : 'Two-step problem'}</div>
      </div>
      <div id="phaseWrap"></div>
    `;
    wrap.appendChild(card);
    stage.appendChild(wrap);

    const phaseWrap = card.querySelector('#phaseWrap');

    function renderPhase(){
      phaseWrap.innerHTML = '';
      // refresh breadcrumb highlighting
      const order = { iDo:0, weDo:1, youDo:2 };
      [...crumbBar.children].forEach((c,i) => {
        const ph = ['iDo','weDo','youDo'][i];
        const meta = PHASE_META[ph];
        c.className = 'wp-crumb' + (ph === wpPhase ? ' active ' + meta.key : (order[ph] < order[wpPhase] ? ' done' : ''));
      });

      if(wpPhase === 'youDo'){ renderYouDo(); return; }

      const meta = PHASE_META[wpPhase];
      const pdata = data[meta.dataKey];

      const banner = document.createElement('div');
      banner.className = 'wp-phase-banner ' + meta.key;
      banner.innerHTML = `${meta.label} <span class="wp-phase-sub">— ${meta.sub}</span>`;
      phaseWrap.appendChild(banner);

      const problemBox = document.createElement('div');
      problemBox.className = 'wp-problem ' + meta.key;
      problemBox.textContent = pdata.text;
      phaseWrap.appendChild(problemBox);

      const stepsWrap = document.createElement('div');
      phaseWrap.appendChild(stepsWrap);

      for(let i = 0; i <= wpStepIndex && i < 4; i++){
        const step = WP_STEPS[i];
        const el = document.createElement('div');
        el.className = 'wp-step';
        let hintHTML = '';
        if(i === 0){
          hintHTML = `<ul><li>${pdata.draw}</li></ul>`;
        } else if(i === 1){
          hintHTML = `<ul>${pdata.knowns.map(k=>`<li>${k}</li>`).join('')}${pdata.vocab.map(v=>`<li><em>${v}</em></li>`).join('')}</ul>`;
        } else if(i === 2){
          hintHTML = pdata.eqs.map(e => `<div class="wp-eq">${eqLine(e,false)}</div>`).join('');
        } else if(i === 3){
          const last = pdata.eqs[pdata.eqs.length-1];
          hintHTML = pdata.eqs.map(e => `<div class="wp-eq">${eqLine(e,true)}</div>`).join('') +
            `<div class="wp-eq" style="margin-top:8px;">🎉 Final answer: <span class="final">${fmt(last.rem ? last.q : last.ans)}${last.rem ? ' remainder ' + last.r : ''}</span></div>`;
        }
        el.innerHTML = `
          <div class="wp-step-head">
            <div class="wp-step-num">${i+1}</div>
            <div class="wp-step-title">${step.title}</div>
          </div>
          <div class="wp-step-prompt">${step.prompt}</div>
          <button class="wp-hint-btn">${i===3 ? 'Show working' : 'Show clue'}</button>
          <div class="wp-hint-content">${hintHTML}</div>
        `;
        const hbtn = el.querySelector('.wp-hint-btn');
        const hcontent = el.querySelector('.wp-hint-content');
        hbtn.addEventListener('click', () => {
          hcontent.classList.toggle('show');
          hbtn.textContent = hcontent.classList.contains('show') ? 'Hide' : (i===3 ? 'Show working' : 'Show clue');
        });
        stepsWrap.appendChild(el);
      }

      const nextWrap = document.createElement('div');
      nextWrap.className = 'wp-next-wrap';
      if(wpStepIndex < 3){
        nextWrap.innerHTML = `<button class="wp-next-btn">Next step ▶</button>`;
        nextWrap.querySelector('button').addEventListener('click', () => { wpStepIndex++; renderPhase(); });
      } else if(wpPhase === 'iDo'){
        nextWrap.innerHTML = `<button class="wp-next-btn">We Do it together ▶</button>`;
        nextWrap.querySelector('button').addEventListener('click', () => { wpPhase = 'weDo'; wpStepIndex = 0; renderPhase(); });
      } else if(wpPhase === 'weDo'){
        nextWrap.innerHTML = `<button class="wp-next-btn">Now You Do it ▶</button>`;
        nextWrap.querySelector('button').addEventListener('click', () => { wpPhase = 'youDo'; renderPhase(); });
      }
      phaseWrap.appendChild(nextWrap);
    }

    function renderYouDo(){
      const meta = PHASE_META.youDo;
      const pdata = data.youDo;

      const banner = document.createElement('div');
      banner.className = 'wp-phase-banner ' + meta.key;
      banner.innerHTML = `${meta.label} <span class="wp-phase-sub">— ${meta.sub}</span>`;
      phaseWrap.appendChild(banner);

      const layout = document.createElement('div');
      layout.className = 'wp-youdo-layout';

      const remember = document.createElement('div');
      remember.className = 'wp-remember';
      remember.innerHTML = `
        <h5>Remember the steps</h5>
        <ol>
          ${WP_STEPS.map(s => `<li>${s.title}</li>`).join('')}
        </ol>
      `;

      const main = document.createElement('div');
      main.className = 'wp-youdo-main';
      const problemBox = document.createElement('div');
      problemBox.className = 'wp-problem ' + meta.key;
      problemBox.textContent = pdata.text;
      main.appendChild(problemBox);

      const box = document.createElement('div');
      box.className = 'wp-practice';
      box.innerHTML = `
        <button class="wp-reveal-btn">Show answer</button>
        <div class="wp-practice-solution">
          ${pdata.eqs.map(e => `<div class="wp-eq">${eqLine(e,true)}</div>`).join('')}
          <div class="wp-eq" style="margin-top:6px;">🎉 Final answer: <span class="final">${fmt(pdata.eqs[pdata.eqs.length-1].rem ? pdata.eqs[pdata.eqs.length-1].q : pdata.eqs[pdata.eqs.length-1].ans)}${pdata.eqs[pdata.eqs.length-1].rem ? ' remainder ' + pdata.eqs[pdata.eqs.length-1].r : ''}</span></div>
        </div>
      `;
      const rbtn = box.querySelector('.wp-reveal-btn');
      const sol = box.querySelector('.wp-practice-solution');
      rbtn.addEventListener('click', () => {
        sol.classList.toggle('show');
        rbtn.textContent = sol.classList.contains('show') ? 'Hide answer' : 'Show answer';
        if(sol.classList.contains('show')) completedWPParts.add(part);
      });
      main.appendChild(box);

      layout.appendChild(main);
      layout.appendChild(remember);
      phaseWrap.appendChild(layout);
    }

    renderPhase();
  }

  buildTabs();
  render();
</script>
</body>
</html>
